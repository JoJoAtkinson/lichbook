name: LichToggle
options:
  bundleIdPrefix: com.lichbook
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"   # ad-hoc; local use only
targets:
  LichToggle:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources: [App]
    dependencies:
      - target: LichControl
        embed: true   # lands in Contents/PlugIns
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "1.0"
  LichControl:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/LichControl.entitlements   # generated by build.sh (needs $HOME)
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.lichbook.LichToggle.LichControl
schemes:
  LichToggle:
    build:
      targets:
        LichToggle: all
