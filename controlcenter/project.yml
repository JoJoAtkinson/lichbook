# xcodegen spec for the Control Center control.
#
# The .xcodeproj is generated, never hand-edited and never the source of
# truth — this file is. `../build.sh` runs `xcodegen generate` and then
# builds headlessly with xcodebuild, so the whole thing works from a
# terminal without opening Xcode. If you change something here, re-run
# build.sh rather than fixing up the project in the IDE.
#
# Shape: a do-nothing container app (App/) with the control extension
# (Widget/) embedded inside it. macOS will not discover an appex on its own —
# it has to arrive inside a launched app bundle.
name: LichToggle
options:
  bundleIdPrefix: com.lichbook
settings:
  base:
    SWIFT_VERSION: "5.0"
    # ControlWidget is macOS 26+ (Tahoe) API — nothing older can build or run
    # this target. The menu bar app in ../menubar is the fallback for
    # earlier systems.
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Manual + "-" = ad-hoc signature: builds on any machine with no Apple
    # Developer account, and is strictly local. Not notarized, so a copy
    # handed to another Mac will be refused by Gatekeeper. build.sh re-signs
    # the products afterwards to attach the generated entitlements.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"   # ad-hoc; local use only
targets:
  LichToggle:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources: [App]
    dependencies:
      - target: LichControl
        embed: true   # lands in Contents/PlugIns
    info:
      path: App/Info.plist
      properties:
        # No Dock tile, no menu bar: the app is a delivery vehicle, not a UI.
        LSUIElement: true
        CFBundleShortVersionString: "1.0"
  LichControl:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: "1.0"
        # WidgetKit is the extension point for controls as well as widgets;
        # a ControlWidget in the bundle is what makes it a Control Center item.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # NOT checked in and NOT authored by hand: the sandbox exception has to
    # name an absolute $HOME path, so build.sh writes this file per-user —
    # and writes it AFTER xcodegen, which truncates any entitlements file it
    # finds referenced here. Order matters; see build.sh.
    entitlements:
      path: Widget/LichControl.entitlements   # generated by build.sh (needs $HOME)
    settings:
      base:
        # Compile against the extension-safe API subset, so anything an appex
        # is forbidden to call fails at build time rather than at runtime.
        APPLICATION_EXTENSION_API_ONLY: "YES"
        # Must be <container app id>.<suffix> or macOS rejects the extension.
        PRODUCT_BUNDLE_IDENTIFIER: com.lichbook.LichToggle.LichControl
# Single scheme; build.sh builds this one by name.
schemes:
  LichToggle:
    build:
      targets:
        LichToggle: all
